<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAID'S PERFUMES | Admin Portal Login</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/luxury-glow.css">
</head>
<body class="min-h-screen bg-[#070709] flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#0D0D14] border-2 border-[#D4AF37]/50 rounded-3xl p-8 space-y-6 shadow-2xl glow-gold-lg relative overflow-hidden">
    <!-- Ambient glow -->
    <div class="absolute -top-20 -right-20 w-48 h-48 rounded-full bg-[#D4AF37]/20 blur-2xl pointer-events-none"></div>

    <div class="text-center space-y-2">
      <img src="/images/logo-emblem.png" alt="ZAID'S PERFUMES" class="w-16 h-16 mx-auto rounded-2xl bg-white p-1 object-contain shadow-lg">
      <h1 class="text-2xl font-bold font-serif-luxury gradient-gold-text">ZAID'S PERFUMES</h1>
      <p class="text-xs text-gray-400 uppercase font-mono tracking-widest">Admin Control Console</p>
    </div>

    <!-- Login Form -->
    <form id="admin-login-form" class="space-y-4 text-xs">
      <div class="space-y-1">
        <label class="text-gray-300 font-medium">Administrator Email</label>
        <input 
          id="adm-email" 
          type="email" 
          placeholder="admin@zaidsperfumes.com" 
          autocomplete="username"
          required 
          class="w-full bg-[#14141E] border border-white/10 rounded-xl p-3 text-white focus:border-[#D4AF37] focus:outline-none"
        >
      </div>

      <div class="space-y-1">
        <label class="text-gray-300 font-medium">Password</label>
        <input 
          id="adm-password" 
          type="password" 
          placeholder="Enter administrator password" 
          autocomplete="current-password"
          required 
          class="w-full bg-[#14141E] border border-white/10 rounded-xl p-3 text-white focus:border-[#D4AF37] focus:outline-none"
        >
      </div>

      <div id="login-error" class="hidden p-3 rounded-xl bg-red-950/60 border border-red-500/40 text-red-200 text-xs">
        <!-- Error message -->
      </div>

      <button 
        type="submit" 
        class="w-full py-3.5 rounded-xl gradient-gold-btn text-black font-extrabold text-xs uppercase tracking-wider font-serif-luxury shadow-lg shadow-[#D4AF37]/30 transition-all"
      >
        Sign In to Admin Panel &rarr;
      </button>
    </form>

    <div class="pt-4 border-t border-white/5 text-center text-xs text-gray-500 space-y-2">
      <div class="flex items-center justify-center gap-1.5 text-[11px] text-gray-400">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span>Protected with Rate Limiting & JWT RBAC</span>
      </div>
      <p class="text-[10px] text-gray-500">Authorized personnel only &bull; <a href="/" class="text-gray-400 hover:text-white hover:underline">Return to Storefront</a></p>
    </div>
  </div>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adm-email').value;
      const password = document.getElementById('adm-password').value;
      const errBox = document.getElementById('login-error');

      try {
        const res = await fetch('/api/auth/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem('zp_admin_token', data.token);
          localStorage.setItem('zp_admin_user', JSON.stringify(data.admin));
          window.location.href = '/admin/';
        } else {
          errBox.textContent = data.message || 'Login failed';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.textContent = 'Server connection error';
        errBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
